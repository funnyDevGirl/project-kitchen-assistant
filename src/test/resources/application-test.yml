---

spring:
  security:
    oauth2:
      client:
        registration:
          todoist:
            client-id: ${TODOIST_CLIENT_ID}
            client-secret: ${TODOIST_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: data:read_write,data:delete
            redirect-uri: https://localhost:8080/api/v1/auth/callback
        provider:
          todoist:
            authorization-uri: https://todoist.com/oauth/authorize
            token-uri: https://todoist.com/oauth/access_token


rsa:
  private-key: ${PRIVATE_KEY}
  public-key: ${PUBLIC_KEY}

# получение token для запросов к YandexGPT:
JWT_TOKEN: ${GPT_JWT_TOKEN}
gpt-token-url: "https://iam.api.cloud.yandex.net/iam/v1/tokens"

# данные для YandexGPT:
FOLDER_ID: ${GPT_FOLDER_ID}
gpt-api-url: "https://llm.api.cloud.yandex.net/foundationModels/v1/completion"

# данные для создания задач в Todoist:
todoist-tasks-api-url: "https://api.todoist.com/rest/v2/tasks"
