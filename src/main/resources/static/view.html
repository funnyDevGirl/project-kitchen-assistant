<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<!-- Навигационный блок -->
<nav class="navbar navbar-expand-lg navbar-light bg-light" id="navbar">
    <a class="navbar-brand" href="/">Kitchen Assistant</a>
    <div class="ml-auto">
        <button class="btn btn-outline-primary" id="searchRecipesBtn">На страницу поиска</button>
        <button id="logoutBtn" class="btn btn-outline-danger ml-2">Выйти</button>
    </div>
</nav>

<div class="container mt-5">
    <div class="recipe-card">
        <h4 id="recipeName">Название рецепта</h4>
        <p id="recipeIngredients">Ингредиенты</p>
        <p id="recipeInstructions">Инструкции</p>
        <button id="favoritesBtn" class="btn btn-outline-info ml-2">Назад к рецептам</button>
    </div>
</div>

<script>
    $(document).ready(function() {

        // Get the current URL
        const currentUrl = window.location.href;

        // Create a URL object
        const parsedUrl = new URL(currentUrl);

        // Get query parameters
        const params = new URLSearchParams(parsedUrl.search);

        // Access individual parameters
        const recipeId = params.get('id');

        // Получение данных рецепта
        $.ajax({
            url: `/api/v1/recipes/${recipeId}`,
            type: 'GET',
            success: function(recipe) {
                $('#recipeName').text(recipe.name);
                $('#recipeIngredients').text(recipe.ingredients);
                $('#recipeInstructions').text(recipe.instructions);
            },
            error: function() {
                alert('Ошибка при загрузке рецепта.');
                window.location.href = '/404.html'; // Редирект на страницу 404
            }
        });

        $("#favoritesBtn").click(function() {
            window.location.href = '/favorites.html'; // Редирект на favorites.html
        });

        $("#searchRecipesBtn").click(function() {
            window.location.href = '/'; // Редирект на главную страницу
        });

        // Обработка выхода
        $("#logoutBtn").click(function() {
            localStorage.removeItem('jwt-token');
            localStorage.removeItem('userId');
            localStorage.removeItem('username');
            window.location.href = '/'; // Переход на главную страницу
        });
    });
</script>
</body>
</html>
