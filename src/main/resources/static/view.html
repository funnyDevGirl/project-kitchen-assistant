<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<!-- Навигационный блок -->
<nav class="navbar navbar-expand-lg navbar-light bg-light" id="navbar">
    <a class="navbar-brand" href="/">Kitchen Assistant</a>
    <div class="ml-auto">
        <button class="btn btn-outline-primary" id="searchRecipesBtn">На страницу поиска</button>
        <button id="logoutBtn" class="btn btn-outline-danger ml-2">Выйти</button>
    </div>
</nav>

<div class="container mt-5">
    <div class="recipe-card">
        <h4 id="recipeName">Название рецепта</h4>
        <p id="recipeIngredients">Ингредиенты</p>
        <p id="recipeInstructions">Инструкции</p>
        <button id="favoritesBtn" class="btn btn-outline-info ml-2">Назад к рецептам</button>


        <button id="createShoppingListBtn" class="btn btn-success ml-2">Сформировать список покупок</button>


    </div>
</div>


<div id="taskForm" style="display:none;">
    <h4>Создание задачи</h4>
    <form id="createTask">
        <div class="form-group">
            <label for="taskContent">Список ингредиентов:</label>
            <textarea class="form-control" id="taskContent" rows="3" readonly></textarea>
        </div>
        <div class="form-group">
            <label for="taskDescription">Описание:</label>
            <input type="text" class="form-control" id="taskDescription" required>
        </div>
        <div class="form-group">
            <label for="taskLabels">Метки:</label>
            <select multiple class="form-control" id="taskLabels">
                <option value="Food">Food</option>
                <option value="Shopping">Shopping</option>
            </select>
        </div>
        <div class="form-group">
            <label for="taskDueDate">Дата выполнения:</label>
            <input type="date" class="form-control" id="taskDueDate">
        </div>
        <div class="form-group">
            <label for="taskDueString">Дополнительная информация:</label>
            <input type="text" class="form-control" id="taskDueString">
        </div>
        <button type="submit" class="btn btn-primary">Создать задачу</button>
        <button type="button" class="btn btn-secondary" id="cancelBtn">Отмена</button>
    </form>
</div>


<script>
    $(document).ready(function() {

        // Get the current URL
        const currentUrl = window.location.href;

        // Create a URL object
        const parsedUrl = new URL(currentUrl);

        // Get query parameters
        const params = new URLSearchParams(parsedUrl.search);

        // Access individual parameters
        const recipeId = params.get('id');

        // Получение данных рецепта
        $.ajax({
            url: `/api/v1/recipes/${recipeId}`,
            type: 'GET',
            success: function(recipe) {
                $('#recipeName').text(recipe.name);
                $('#recipeIngredients').text(recipe.ingredients);
                $('#recipeInstructions').text(recipe.instructions);
            },
            error: function() {
                alert('Ошибка при загрузке рецепта.');
                window.location.href = '/404.html'; // Редирект на страницу 404
            }
        });

        $("#favoritesBtn").click(function() {
            window.location.href = '/favorites.html'; // Редирект на favorites.html
        });

        $("#searchRecipesBtn").click(function() {
            window.location.href = '/'; // Редирект на главную страницу
        });




        $("#createShoppingListBtn").click(function() {

            // Заполняем список ингредиентов из выбранных рецептов
            let ingredientsList = recipes.map(recipe => recipe.ingredients).join(", ");

            $("#taskContent").val(ingredientsList);

            // Показываем форму
            $("#taskForm").show();
        });

        // Обработка отправки формы
        $("#createTask").submit(function(event) {
            event.preventDefault();

            const taskRequest = {
                content: $("#taskContent").val(),
                description: $("#taskDescription").val(),
                labels: Array.from($("#taskLabels").val()),
                dueDate: $("#taskDueDate").val(),
                dueString: $("#taskDueString").val()
            };

            $.ajax({
                url: '/api/v1/tasks',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(taskRequest),
                success: function(response) {
                    alert("Задача успешно создана!");
                    $("#taskForm").hide(); // Скрываем форму
                    $("#taskForm")[0].reset(); // Сбрасываем форму
                },
                error: function(xhr, status, error) {
                    console.error("Ошибка при создании задачи: " + error);
                    alert("Произошла ошибка при создании задачи.");
                }
            });
        });

        // Обработка кнопки отмены
        $("#cancelBtn").click(function() {
            $("#taskForm").hide();
        });





        // Обработка выхода
        $("#logoutBtn").click(function() {
            localStorage.removeItem('jwt-token');
            localStorage.removeItem('userId');
            localStorage.removeItem('username');
            window.location.href = '/'; // Переход на главную страницу
        });
    });
</script>
</body>
</html>
