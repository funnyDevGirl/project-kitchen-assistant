<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<!-- Навигационный блок -->
<nav class="navbar navbar-expand-lg navbar-light bg-light" id="navbar" style="display: none;">
    <a class="navbar-brand" href="/">Kitchen Assistant</a>
    <div class="ml-auto">
        <button id="viewRecipes" class="btn btn-outline-info ml-2">Избранные рецепты</button>
        <button id="profileBtn" class="btn btn-outline-primary ml-2">Личный кабинет</button>
        <button id="logoutBtn" class="btn btn-outline-danger ml-2">Выйти</button>
    </div>
</nav>

<div class="container mt-5">
    <div id="loginContainer" class="mb-4">
        <form id="loginForm">
            <h2>Вход</h2>
            <div class="form-group">
                <label for="email">Электронная почта</label>
                <input type="email" class="form-control" id="email" required placeholder="Введите email...">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" class="form-control" id="password" required placeholder="Введите пароль...">
            </div>
            <button type="submit" class="btn btn-primary">Войти</button>
            <div id="message" class="mt-2"></div>
        </form>
        <p class="mt-3">У вас нет аккаунта? <a href="#" id="showRegister" class="btn btn-link">Зарегистрироваться</a></p>
    </div>

    <div id="registerContainer" style="display: none;">
        <h2>Регистрация</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="regFirstName">Имя</label>
                <input type="text" class="form-control" id="regFirstName" required placeholder="Введите имя...">
            </div>
            <div class="form-group">
                <label for="regLastName">Фамилия</label>
                <input type="text" class="form-control" id="regLastName" required placeholder="Введите фамилию...">
            </div>
            <div class="form-group">
                <label for="regEmail">Электронная почта</label>
                <input type="email" class="form-control" id="regEmail" required placeholder="Введите email...">
            </div>
            <div class="form-group">
                <label for="regPassword">Пароль</label>
                <input type="password" class="form-control" id="regPassword" required placeholder="Введите пароль...">
            </div>
            <button type="submit" class="btn btn-success">Зарегистрироваться</button>
            <div id="regMessage" class="mt-2"></div>
        </form>
        <p class="mt-3">Уже есть аккаунт? <a href="#" id="showLogin" class="btn btn-link">Войти</a></p>
    </div>

    <div id="searchContainer" style="display: none;">
        <h5>Приступим к поиску рецепта!</h5>

        <div class="input-group mb-3">
            <input type="text" id="searchQuery" class="form-control" placeholder="Введите ингредиенты..." aria-label="Запрос" aria-describedby="button-search">
            <div class="input-group-append">
                <button class="btn btn-primary" id="searchBtn" type="button">Поиск</button>
            </div>
        </div>
    </div>
</div>

<div class="container mt-5" id="results"></div>

<script>
    $(document).ready(function() {

        // Проверяем, авторизован ли пользователь при загрузке страницы
        const token = localStorage.getItem('jwt-token');
        const username = localStorage.getItem('username');

        if (token) {
            $("#navbar").show(); // Показать навигационный блок

            // Обновляем текст на кнопке "Личный кабинет"
            $("#profileBtn").text(`Привет, ${username}!`);

            $("#loginContainer").hide(); // Скрыть форму логина
            $("#searchContainer").show(); // Показать строку поиска
        } else {
            $("#loginContainer").show(); // Показать форму логина
            $("#navbar").hide(); // Скрыть навигационный блок
            $("#searchContainer").hide(); // Скрыть строку поиска
        }


        // Обработка формы входа
        $("#loginForm").on("submit", function(event) {
            event.preventDefault();

            const email = $("#email").val();
            const password = $("#password").val();

            $.ajax({
                url: '/api/v1/login',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ username: email, password }),
                success: function(token) {
                    localStorage.setItem('jwt-token', token);

                    // Теперь сделаем запрос для получения информации о пользователе
                    $.ajax({
                        url: '/api/v1/users/current', // Убедитесь, что здесь правильный URL для получения информации о пользователе
                        type: 'GET',
                        headers: {
                            'Authorization': `Bearer ${token}` // Передаем токен в заголовках
                        },
                        success: function(userInfo) {
                            const firstName = userInfo.firstName; // Предполагается, что ваш API возвращает имя пользователя
                            localStorage.setItem('username', firstName); // Сохраняем firstName в localStorage

                            $("#message").text('Успешный вход!');

                            // Обновление интерфейса
                            $("#navbar").show(); // Показать навигационный блок
                            $("#userGreeting").text(`Привет, ${username}!`); // Установить текст приветствия
                            $("#loginContainer").hide(); // Скрыть форму логина
                            $("#searchContainer").show(); // Показать строку поиска

                            // Обновляем текст на кнопке "Личный кабинет"
                            $("#profileBtn").text(`Привет, ${username}!`);
                        },
                        error: function(xhr, status, error) {
                            $("#message").text('Не удалось получить информацию о пользователе: ' + error);
                        }
                    });
                },
                error: function(xhr, status, error) {
                    alert('Неудачная попытка входа. Попробуйте ещё раз!');
                }
            });
        });

        // Обработка формы регистрации
        $("#registerForm").on("submit", function(event) {
            event.preventDefault();

            const firstName = $("#regFirstName").val();
            const lastName = $("#regLastName").val();
            const email = $("#regEmail").val();
            const password = $("#regPassword").val();

            $.ajax({
                url: '/api/v1/users', // URL для регистрации
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ firstName, lastName, email, password }),
                success: function() {
                    $("#regMessage").text('Регистрация прошла успешно! Теперь вы можете войти в систему.');
                    $("#registerContainer").hide(); // Скрыть форму регистрации
                    $("#loginContainer").show(); // Показать форму логина
                },
                error: function(xhr, status, error) {
                    console.error("Ошибка регистрации: " + error);
                    $("#regMessage").append('<div class="alert alert-danger">Произошла ошибка при регистрации.</div>');
                }
            });
        });

        // Показать форму регистрации
        $("#showRegister").on("click", function() {
            $("#loginContainer").hide(); // Скрыть форму логина
            $("#registerContainer").show(); // Показать форму регистрации
        });

        // Показать форму входа
        $("#showLogin").on("click", function() {
            $("#registerContainer").hide(); // Скрыть форму регистрации
            $("#loginContainer").show(); // Показать форму логина
        });

        // Обработка поиска
        $("#searchBtn").on("click", function() {
            $("#navbar").show(); // Показать навигационный блок


            const query = $("#searchQuery").val();

            if (query.trim() === "") {
              alert("Пожалуйста, введите ингредиенты для поиска.");
              return; // Не продолжаем, если поле пустое
            }

            $.ajax({
                url: '/api/v1/recipes/search',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(query),
                success: function(recipes) {
                    $("#results").empty(); // очищаем результаты перед новым поиском

                    console.log("Received recipes:", recipes); // Проверка полученных данных

                    if (recipes.length > 0) {
                        recipes.forEach(function(recipe) {

                            console.log("Recipe details:", recipe); // Проверка детализации каждого рецепта

                            let recipeHtml = `
                            <div class="card mb-4 recipe-item">
                                <div class="card-body">
                                    <h4 class="card-title">${recipe.name}</h4>
                                    <p class="card-text"><strong>Ингредиенты:</strong> ${recipe.ingredients}</p>
                                    <p class="card-text"><strong>Приготовление:</strong> ${recipe.instructions}</p>
                                    <button class="btn btn-success save-btn" data-recipe='${JSON.stringify(recipe)}'>Добавить в избранное</button>
                                </div>
                            </div>
                            `;
                            $("#results").append(recipeHtml);
                        });
                    } else {
                        $("#results").append('<div class="alert alert-info">Рецепты не найдены.</div>');
                    }

                    // Обработчик клика для кнопок сохранения
                    $(".save-btn").click(function() {
                        const recipe = $(this).data("recipe");

                        const token = localStorage.getItem('jwt-token');

                        $.ajax({
                            url: '/api/v1/recipes',
                            type: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}` // Передаем токен в заголовках
                            },
                            contentType: 'application/json',
                            data: JSON.stringify({
                                name: recipe.name,
                                ingredients: recipe.ingredients,
                                instructions: recipe.instructions
                            }),
                            success: function(response) {
                                alert("Рецепт успешно сохранен!");

                                const recipeId = response.id; // Предполагаем, что response содержит id
                                console.log("Saved recipe's id: ", recipeId); // Проверка, что id создался

                                localStorage.setItem('lastSavedRecipeId', recipeId); // Сохраняем recipe id в localStorage

                                window.location.href = '/view.html?id=' + recipeId;
                            },
                            error: function(xhr, status, error) {
                                console.error("Ошибка при сохранении рецепта: " + error);
                                alert("Произошла ошибка при сохранении рецепта.");
                            }
                        });
                    });
                },
                error: function(xhr, status, error) {
                    console.error("Произошла ошибка: " + error);
                    $("#results").empty().append('<div class="alert alert-danger">Произошла ошибка при поиске рецептов.</div>');
                }
            });
        });

        // Обработка перехода в личный кабинет
        $("#profileBtn").click(function() {
            const userId = localStorage.getItem('userId');
            window.location.href = `/account.html`; // Переход на страницу профиля
        });

        // Обработка кликов на кнопках
          $("#viewRecipes").on("click", function() {
              window.location.href = "/favorites.html"; // Замените на ваш URL для рецептов
          });

        // Обработка выхода
        $("#logoutBtn").click(function() {
            localStorage.removeItem('jwt-token');
            localStorage.removeItem('userId');
            localStorage.removeItem('username');

            $("#navbar").hide(); // Скрыть навигационный блок
            $("#loginContainer").show(); // Показать форму логина
            $("#searchContainer").hide(); // Скрыть строку поиска
            $("#results").hide(); // Скрыть результаты поиска
            window.location.href = '/'; // Переход на главную страницу
        });
    });
</script>
</body>
</html>
